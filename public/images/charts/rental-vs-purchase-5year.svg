<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>가전별 렌탈 vs 구매 5년 총비용 비교 그래프</title>
  <desc>제품별 5년 총비용 중간값 비교. 정수기 렌탈 270만원·구매 115만원, 공기청정기 렌탈 210만원·구매 105만원, 비데 렌탈 120만원·구매 40만원, 건조기 렌탈 270만원·구매 115만원, 세탁기 렌탈 270만원·구매 90만원으로 모든 제품에서 렌탈 총비용이 더 높음.</desc>
  <rect x="0.5" y="0.5" width="719" height="449" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">가전별 렌탈 vs 구매 5년 총비용</text>
  <g font-size="12" fill="#666f7a">
    <rect x="470" y="36" width="12" height="12" rx="2" fill="#2fbf9b"/>
    <text x="487" y="46">렌탈</text>
    <rect x="540" y="36" width="12" height="12" rx="2" fill="#9fe1cb"/>
    <text x="557" y="46">구매</text>
  </g>
  <text x="40" y="70" font-size="13" fill="#666f7a">렌탈은 관리·필터 포함, 구매는 소모품 포함 추정</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="292" x2="690" y2="292"/>
    <line x1="78" y1="193" x2="690" y2="193"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="296">100만</text>
    <text x="68" y="197">200만</text>
    <text x="68" y="99">300만</text>
  </g>

  <g>
    <rect x="96" y="124" width="40" height="266" rx="3" fill="#2fbf9b"/>
    <rect x="142" y="277" width="40" height="113" rx="3" fill="#9fe1cb"/>
    <rect x="219" y="183" width="40" height="207" rx="3" fill="#2fbf9b"/>
    <rect x="265" y="287" width="40" height="103" rx="3" fill="#9fe1cb"/>
    <rect x="341" y="272" width="40" height="118" rx="3" fill="#2fbf9b"/>
    <rect x="387" y="351" width="40" height="39" rx="3" fill="#9fe1cb"/>
    <rect x="463" y="124" width="40" height="266" rx="3" fill="#2fbf9b"/>
    <rect x="509" y="277" width="40" height="113" rx="3" fill="#9fe1cb"/>
    <rect x="586" y="124" width="40" height="266" rx="3" fill="#2fbf9b"/>
    <rect x="632" y="301" width="40" height="89" rx="3" fill="#9fe1cb"/>
  </g>

  <g font-size="10" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="116" y="117">270</text>
    <text x="162" y="270">115</text>
    <text x="239" y="176">210</text>
    <text x="285" y="280">105</text>
    <text x="361" y="265">120</text>
    <text x="407" y="344">40</text>
    <text x="483" y="117">270</text>
    <text x="529" y="270">115</text>
    <text x="606" y="117">270</text>
    <text x="652" y="294">90</text>
  </g>

  <g font-size="12" fill="#1f2d3d" text-anchor="middle">
    <text x="139" y="411">정수기</text>
    <text x="262" y="411">공기청정기</text>
    <text x="384" y="411">비데</text>
    <text x="506" y="411">건조기</text>
    <text x="629" y="411">세탁기</text>
  </g>

  <text x="40" y="438" font-size="11" fill="#9a9488">※ 중간값 추정(단위 만원). 모델·약정·프로모션에 따라 달라집니다.</text>
</svg>
