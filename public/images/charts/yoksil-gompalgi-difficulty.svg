<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>욕실 곰팡이 부위별 제거 난이도 인포그래픽</title>
  <desc>욕실 곰팡이 부위별 제거 난이도와 셀프 처리 가능 여부. 타일 표면은 쉬움·셀프 가능, 타일 줄눈은 어려움·초기만 가능, 실리콘은 어려움·교체 필요, 천장과 욕실장 하단은 중간·셀프 가능.</desc>
  <rect x="0.5" y="0.5" width="719" height="429" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">욕실 곰팡이 부위별 제거 난이도</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">부위에 따라 셀프 처리 가능 여부가 다릅니다</text>

  <g>
    <rect x="40" y="92" width="640" height="60" rx="8" fill="#f6f4ee"/>
    <text x="62" y="128" font-size="15" font-weight="700" fill="#1f2d3d">타일 표면</text>
    <circle cx="360" cy="122" r="6" fill="#2fbf9b"/><circle cx="382" cy="122" r="6" fill="#d9e6e0"/><circle cx="404" cy="122" r="6" fill="#d9e6e0"/>
    <text x="430" y="127" font-size="12" fill="#666f7a">쉬움</text>
    <text x="658" y="128" font-size="13" font-weight="700" fill="#189a7b" text-anchor="end">셀프 가능</text>
  </g>
  <g>
    <rect x="40" y="158" width="640" height="60" rx="8" fill="#f6f4ee"/>
    <text x="62" y="194" font-size="15" font-weight="700" fill="#1f2d3d">타일 줄눈</text>
    <circle cx="360" cy="188" r="6" fill="#2fbf9b"/><circle cx="382" cy="188" r="6" fill="#2fbf9b"/><circle cx="404" cy="188" r="6" fill="#2fbf9b"/>
    <text x="430" y="193" font-size="12" fill="#666f7a">어려움</text>
    <text x="658" y="194" font-size="13" font-weight="700" fill="#9a9488" text-anchor="end">초기에만 가능</text>
  </g>
  <g>
    <rect x="40" y="224" width="640" height="60" rx="8" fill="#f6f4ee"/>
    <text x="62" y="260" font-size="15" font-weight="700" fill="#1f2d3d">실리콘 (코킹)</text>
    <circle cx="360" cy="254" r="6" fill="#2fbf9b"/><circle cx="382" cy="254" r="6" fill="#2fbf9b"/><circle cx="404" cy="254" r="6" fill="#2fbf9b"/>
    <text x="430" y="259" font-size="12" fill="#666f7a">어려움</text>
    <text x="658" y="260" font-size="13" font-weight="700" fill="#9a9488" text-anchor="end">대부분 교체 필요</text>
  </g>
  <g>
    <rect x="40" y="290" width="640" height="60" rx="8" fill="#f6f4ee"/>
    <text x="62" y="326" font-size="15" font-weight="700" fill="#1f2d3d">천장</text>
    <circle cx="360" cy="320" r="6" fill="#2fbf9b"/><circle cx="382" cy="320" r="6" fill="#2fbf9b"/><circle cx="404" cy="320" r="6" fill="#d9e6e0"/>
    <text x="430" y="325" font-size="12" fill="#666f7a">중간</text>
    <text x="658" y="326" font-size="13" font-weight="700" fill="#189a7b" text-anchor="end">셀프 가능</text>
  </g>
  <g>
    <rect x="40" y="356" width="640" height="60" rx="8" fill="#f6f4ee"/>
    <text x="62" y="392" font-size="15" font-weight="700" fill="#1f2d3d">욕실장 하단</text>
    <circle cx="360" cy="386" r="6" fill="#2fbf9b"/><circle cx="382" cy="386" r="6" fill="#2fbf9b"/><circle cx="404" cy="386" r="6" fill="#d9e6e0"/>
    <text x="430" y="391" font-size="12" fill="#666f7a">중간</text>
    <text x="658" y="392" font-size="13" font-weight="700" fill="#189a7b" text-anchor="end">셀프 가능</text>
  </g>
</svg>
