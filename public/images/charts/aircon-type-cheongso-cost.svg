<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>벽걸이 vs 스탠드 에어컨 청소 비용 비교 그래프</title>
  <desc>에어컨 종류별 청소 비용 중간값. 벽걸이 기본 약 8만원·분해 약 10만원, 스탠드 기본 약 10만원·분해 약 15만원.</desc>
  <rect x="0.5" y="0.5" width="719" height="449" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">에어컨 종류별 청소 비용 비교</text>
  <g font-size="12" fill="#666f7a">
    <rect x="438" y="36" width="12" height="12" rx="2" fill="#9fe1cb"/>
    <text x="455" y="46">기본 청소</text>
    <rect x="548" y="36" width="12" height="12" rx="2" fill="#2fbf9b"/>
    <text x="565" y="46">분해 청소</text>
  </g>
  <text x="40" y="70" font-size="13" fill="#666f7a">벽걸이 vs 스탠드 · 기본/분해 청소 기준</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="316" x2="690" y2="316"/>
    <line x1="78" y1="243" x2="690" y2="243"/>
    <line x1="78" y1="169" x2="690" y2="169"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="320">5만</text>
    <text x="68" y="247">10만</text>
    <text x="68" y="173">15만</text>
    <text x="68" y="99">20만</text>
  </g>

  <rect x="157" y="272" width="70" height="118" rx="4" fill="#9fe1cb"/>
  <rect x="235" y="242" width="70" height="148" rx="4" fill="#2fbf9b"/>
  <rect x="463" y="242" width="70" height="148" rx="4" fill="#9fe1cb"/>
  <rect x="541" y="169" width="70" height="221" rx="4" fill="#2fbf9b"/>

  <g font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="192" y="264">8만</text>
    <text x="270" y="234">10만</text>
    <text x="498" y="234">10만</text>
    <text x="576" y="161">15만</text>
  </g>

  <g font-size="14" fill="#1f2d3d" text-anchor="middle">
    <text x="231" y="412">벽걸이</text>
    <text x="537" y="412">스탠드</text>
  </g>

  <text x="40" y="438" font-size="11" fill="#9a9488">※ 지역·업체·오염도에 따라 실제 비용은 달라집니다.</text>
</svg>
