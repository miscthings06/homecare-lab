<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>드럼 vs 통돌이 세탁기 청소 비용 비교 그래프</title>
  <desc>전문 청소 기준 비용 중간값. 드럼세탁기 약 10.5만원, 통돌이세탁기 약 9만원.</desc>
  <rect x="0.5" y="0.5" width="719" height="449" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">드럼 vs 통돌이 세탁기 청소 비용</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">전문 청소 기준</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="292" x2="690" y2="292"/>
    <line x1="78" y1="193" x2="690" y2="193"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="296">5만</text>
    <text x="68" y="197">10만</text>
    <text x="68" y="99">15만</text>
  </g>

  <g fill="#2fbf9b">
    <rect x="176" y="183" width="110" height="207" rx="4"/>
    <rect x="482" y="213" width="110" height="177" rx="4"/>
  </g>

  <g font-size="15" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="231" y="175">10.5만원</text>
    <text x="537" y="205">9만원</text>
  </g>

  <g font-size="14" fill="#1f2d3d" text-anchor="middle">
    <text x="231" y="412">드럼세탁기</text>
    <text x="537" y="412">통돌이세탁기</text>
  </g>

  <text x="40" y="438" font-size="11" fill="#9a9488">※ 지역·업체·오염도에 따라 실제 비용은 달라집니다.</text>
</svg>
