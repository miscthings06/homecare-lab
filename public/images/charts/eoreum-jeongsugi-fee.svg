<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>얼음정수기 vs 일반 정수기 월 렌탈료 비교 그래프</title>
  <desc>월 렌탈료 중간값 비교. 얼음정수기 약 5.5만원, 일반 정수기 약 3.5만원으로 얼음정수기가 월 1~3만원 더 높음.</desc>
  <rect x="0.5" y="0.5" width="719" height="449" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1f2d3d">얼음정수기 vs 일반 정수기 월 렌탈료</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">얼음정수기가 월 1~3만원 더 높습니다</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="316" x2="690" y2="316"/>
    <line x1="78" y1="243" x2="690" y2="243"/>
    <line x1="78" y1="169" x2="690" y2="169"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="320">2만</text>
    <text x="68" y="247">4만</text>
    <text x="68" y="173">6만</text>
    <text x="68" y="99">8만</text>
  </g>

  <g fill="#2fbf9b">
    <rect x="176" y="187" width="110" height="203" rx="4"/>
    <rect x="482" y="261" width="110" height="129" rx="4"/>
  </g>

  <g font-size="15" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="231" y="179">5.5만원</text>
    <text x="537" y="253">3.5만원</text>
  </g>

  <g font-size="14" fill="#1f2d3d" text-anchor="middle">
    <text x="231" y="412">얼음정수기</text>
    <text x="537" y="412">일반 정수기</text>
  </g>

  <text x="40" y="438" font-size="11" fill="#9a9488">※ 전기요금도 얼음정수기가 월 3~4천원가량 더 나옵니다.</text>
</svg>
