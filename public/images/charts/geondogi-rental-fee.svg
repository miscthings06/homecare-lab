<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>건조기 유형별 렌탈 월 요금 그래프</title>
  <desc>건조기 유형별 렌탈 월 요금 중간값. 전기히터 드럼 약 4만원, 히트펌프 중급 약 5.5만원, 히트펌프 대형 약 8만원, 세탁건조 일체형 약 7만원.</desc>
  <rect x="0.5" y="0.5" width="719" height="459" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">건조기 유형별 렌탈 월 요금</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">전기히터·히트펌프 방식별 기준</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="331" x2="690" y2="331"/>
    <line x1="78" y1="272" x2="690" y2="272"/>
    <line x1="78" y1="213" x2="690" y2="213"/>
    <line x1="78" y1="154" x2="690" y2="154"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="335">2만</text>
    <text x="68" y="276">4만</text>
    <text x="68" y="217">6만</text>
    <text x="68" y="158">8만</text>
    <text x="68" y="99">10만</text>
  </g>

  <g fill="#2fbf9b">
    <rect x="119" y="272" width="72" height="118" rx="4"/>
    <rect x="272" y="228" width="72" height="162" rx="4"/>
    <rect x="425" y="154" width="72" height="236" rx="4"/>
    <rect x="578" y="183" width="72" height="207" rx="4"/>
  </g>

  <g font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="155" y="264">4만</text>
    <text x="308" y="220">5.5만</text>
    <text x="461" y="146">8만</text>
    <text x="614" y="175">7만</text>
  </g>

  <g text-anchor="middle">
    <text x="155" y="411" font-size="13" fill="#1f2d3d">전기히터</text>
    <text x="308" y="411" font-size="13" fill="#1f2d3d">히트펌프</text>
    <text x="461" y="411" font-size="13" fill="#1f2d3d">히트펌프</text>
    <text x="614" y="411" font-size="13" fill="#1f2d3d">세탁건조</text>
    <text x="155" y="429" font-size="11" fill="#9a9488">드럼</text>
    <text x="308" y="429" font-size="11" fill="#9a9488">중급</text>
    <text x="461" y="429" font-size="11" fill="#9a9488">대형</text>
    <text x="614" y="429" font-size="11" fill="#9a9488">일체형</text>
  </g>

  <text x="40" y="452" font-size="11" fill="#9a9488">※ 용량·브랜드·약정 조건에 따라 실제 요금은 달라집니다.</text>
</svg>
