<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>TV 크기별 월 전기요금 그래프</title>
  <desc>하루 5시간 사용 기준, kWh당 165원으로 계산한 TV 화면 크기별 월 전기요금 추정값. 32인치 약 880원, 43인치 약 1,490원, 55인치 약 2,480원, 65인치 약 3,090원, 75인치 약 4,830원.</desc>
  <rect x="0.5" y="0.5" width="719" height="449" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">TV 크기별 월 전기요금</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">하루 5시간 사용 · kWh당 165원 기준 추정</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="331" x2="690" y2="331"/>
    <line x1="78" y1="272" x2="690" y2="272"/>
    <line x1="78" y1="213" x2="690" y2="213"/>
    <line x1="78" y1="154" x2="690" y2="154"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="335">1천</text>
    <text x="68" y="276">2천</text>
    <text x="68" y="217">3천</text>
    <text x="68" y="158">4천</text>
    <text x="68" y="99">5천</text>
  </g>

  <g fill="#2fbf9b">
    <rect x="109" y="338" width="60" height="52" rx="4"/>
    <rect x="232" y="302" width="60" height="88" rx="4"/>
    <rect x="354" y="244" width="60" height="146" rx="4"/>
    <rect x="476" y="208" width="60" height="182" rx="4"/>
    <rect x="599" y="105" width="60" height="285" rx="4"/>
  </g>

  <g font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="139" y="330">880원</text>
    <text x="262" y="294">1,490원</text>
    <text x="384" y="236">2,480원</text>
    <text x="506" y="200">3,090원</text>
    <text x="629" y="97">4,830원</text>
  </g>

  <g font-size="13" fill="#1f2d3d" text-anchor="middle">
    <text x="139" y="411">32인치</text>
    <text x="262" y="411">43인치</text>
    <text x="384" y="411">55인치</text>
    <text x="506" y="411">65인치</text>
    <text x="629" y="411">75인치</text>
  </g>

  <text x="40" y="438" font-size="11" fill="#9a9488">※ 패널 종류·밝기·콘텐츠에 따라 실제 요금은 달라집니다.</text>
</svg>
