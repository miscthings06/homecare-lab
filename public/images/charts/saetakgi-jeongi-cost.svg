<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>세탁기 유형별 월 전기요금 그래프</title>
  <desc>주 4회 세탁, kWh당 165원 기준 월 전기요금 중간값. 통돌이 냉수 약 750원, 통돌이 온수 약 3,500원, 드럼 냉수 약 1,600원, 드럼 40도 약 2,500원, 드럼 60도 약 5,000원.</desc>
  <rect x="0.5" y="0.5" width="719" height="449" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">세탁기 유형별 월 전기요금</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">주 4회 세탁 · kWh당 165원 기준 추정</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="316" x2="690" y2="316"/>
    <line x1="78" y1="243" x2="690" y2="243"/>
    <line x1="78" y1="169" x2="690" y2="169"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="320">1,500</text>
    <text x="68" y="247">3,000</text>
    <text x="68" y="173">4,500</text>
    <text x="68" y="99">6,000</text>
  </g>

  <g fill="#2fbf9b">
    <rect x="109" y="353" width="60" height="37" rx="4"/>
    <rect x="232" y="218" width="60" height="172" rx="4"/>
    <rect x="354" y="311" width="60" height="79" rx="4"/>
    <rect x="476" y="267" width="60" height="123" rx="4"/>
    <rect x="599" y="144" width="60" height="246" rx="4"/>
  </g>

  <g font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="139" y="345">750원</text>
    <text x="262" y="210">3,500원</text>
    <text x="384" y="303">1,600원</text>
    <text x="506" y="259">2,500원</text>
    <text x="629" y="136">5,000원</text>
  </g>

  <g font-size="13" fill="#1f2d3d" text-anchor="middle">
    <text x="139" y="411">통돌이 냉수</text>
    <text x="262" y="411">통돌이 온수</text>
    <text x="384" y="411">드럼 냉수</text>
    <text x="506" y="411">드럼 40°C</text>
    <text x="629" y="411">드럼 60°C</text>
  </g>

  <text x="40" y="438" font-size="11" fill="#9a9488">※ 온수 가열 여부에 따라 요금 차이가 크게 벌어집니다.</text>
</svg>
