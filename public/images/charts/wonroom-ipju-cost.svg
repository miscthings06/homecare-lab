<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>원룸·오피스텔 유형별 입주청소 비용 그래프</title>
  <desc>수도권 일반 오염도 기준 유형별 입주청소 기본 비용 중간값. 원룸 7평 이하 약 10만원, 원룸 10평 약 15만원, 오피스텔 15평 약 22만원, 오피스텔 20평 약 27만원, 투룸 20평 약 32만원.</desc>
  <rect x="0.5" y="0.5" width="719" height="459" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1f2d3d">원룸·오피스텔 유형별 입주청소 비용</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">수도권 일반 오염도 기준 (2026년)</text>

  <g stroke="#eee8db" stroke-width="1">
