<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>전기요금 누진 구간별 단가 그래프</title>
  <desc>주택용 저압 전력량 요금 단가. 1구간(200kWh 이하) 약 88.3원, 2구간(201~400kWh) 약 182.9원, 3구간(400kWh 초과) 약 275.6원으로 구간이 오를수록 단가가 가파르게 상승.</desc>
  <rect x="0.5" y="0.5" width="719" height="459" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">전기요금 누진 구간별 단가</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">주택용 저압 · kWh당 전력량 요금 (2024년 기준)</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="292" x2="690" y2="292"/>
    <line x1="78" y1="193" x2="690" y2="193"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="296">100</text>
    <text x="68" y="197">200</text>
    <text x="68" y="99">300</text>
  </g>

  <g fill="#2fbf9b">
    <rect x="140" y="303" width="80" height="87" rx="4"/>
    <rect x="344" y="210" width="80" height="180" rx="4"/>
    <rect x="548" y="119" width="80" height="271" rx="4"/>
  </g>

  <g font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="180" y="295">88.3원</text>
    <text x="384" y="202">182.9원</text>
    <text x="588" y="111">275.6원</text>
  </g>

  <g text-anchor="middle">
    <text x="180" y="412" font-size="13" fill="#1f2d3d">1구간</text>
    <text x="384" y="412" font-size="13" fill="#1f2d3d">2구간</text>
    <text x="588" y="412" font-size="13" fill="#1f2d3d">3구간</text>
    <text x="180" y="430" font-size="11" fill="#9a9488">200kWh 이하</text>
    <text x="384" y="430" font-size="11" fill="#9a9488">201~400kWh</text>
    <text x="588" y="430" font-size="11" fill="#9a9488">400kWh 초과</text>
  </g>

  <text x="40" y="452" font-size="11" fill="#9a9488">※ 기본요금·기후환경요금 별도. 한전 고시 개정에 따라 변동.</text>
</svg>
