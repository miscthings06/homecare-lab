<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>가전별 렌탈 이전 설치 비용 그래프</title>
  <desc>이사 시 렌탈 가전별 이전 설치 비용 중간값. 정수기 약 4만원, 비데 약 3만원, 공기청정기 약 1만원, 건조기 약 4.5만원, 냉장고 약 4만원으로 위약금보다 훨씬 저렴.</desc>
  <rect x="0.5" y="0.5" width="719" height="449" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">가전별 렌탈 이전 설치 비용</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">이사 시 · 위약금보다 훨씬 저렴합니다</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="292" x2="690" y2="292"/>
    <line x1="78" y1="193" x2="690" y2="193"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="296">2만</text>
    <text x="68" y="197">4만</text>
    <text x="68" y="99">6만</text>
  </g>

  <g fill="#2fbf9b">
    <rect x="109" y="193" width="60" height="197" rx="4"/>
    <rect x="232" y="242" width="60" height="148" rx="4"/>
    <rect x="354" y="341" width="60" height="49" rx="4"/>
    <rect x="476" y="169" width="60" height="221" rx="4"/>
    <rect x="599" y="193" width="60" height="197" rx="4"/>
  </g>

  <g font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="139" y="185">4만</text>
    <text x="262" y="234">3만</text>
    <text x="384" y="333">1만</text>
    <text x="506" y="161">4.5만</text>
    <text x="629" y="185">4만</text>
  </g>

  <g font-size="12" fill="#1f2d3d" text-anchor="middle">
    <text x="139" y="411">정수기</text>
    <text x="262" y="411">비데</text>
    <text x="384" y="411">공기청정기</text>
    <text x="506" y="411">건조기</text>
    <text x="629" y="411">냉장고</text>
  </g>

  <text x="40" y="438" font-size="11" fill="#9a9488">※ 설치 조건(배기·배관)에 따라 추가 비용이 발생할 수 있습니다.</text>
</svg>
