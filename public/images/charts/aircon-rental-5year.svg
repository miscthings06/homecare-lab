<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>에어컨 5년 총비용 렌탈 vs 구매 비교 그래프</title>
  <desc>중형 벽걸이 에어컨 5년 총비용 중간값. 렌탈 약 243만원, 구매 약 148만원으로 단순 비용은 구매가 더 저렴.</desc>
  <rect x="0.5" y="0.5" width="719" height="449" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">에어컨 5년 총비용 — 렌탈 vs 구매</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">중형 벽걸이 기준 (설치·청소·수리 포함)</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="292" x2="690" y2="292"/>
    <line x1="78" y1="193" x2="690" y2="193"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="296">100만</text>
    <text x="68" y="197">200만</text>
    <text x="68" y="99">300만</text>
  </g>

  <g fill="#2fbf9b">
    <rect x="176" y="151" width="110" height="239" rx="4"/>
    <rect x="482" y="244" width="110" height="146" rx="4"/>
  </g>

  <g font-size="15" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="231" y="143">243만원</text>
    <text x="537" y="236">148만원</text>
  </g>

  <g font-size="14" fill="#1f2d3d" text-anchor="middle">
    <text x="231" y="412">렌탈</text>
    <text x="537" y="412">구매</text>
  </g>

  <text x="40" y="438" font-size="11" fill="#9a9488">※ 약정·사용 빈도·수리 횟수에 따라 실제 비용은 달라집니다.</text>
</svg>
