<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>시스템 에어컨 종류별 청소 비용 그래프</title>
  <desc>실내기 1대당 분해 청소 비용 중간값. 천장 카세트 4방향 약 20만원, 카세트 1·2방향 약 14만원, 천장 덕트형 약 28만원 이상, 벽형 약 10만원.</desc>
  <rect x="0.5" y="0.5" width="719" height="459" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">시스템 에어컨 종류별 청소 비용</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">실내기 1대당 · 분해 청소 기준</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="316" x2="690" y2="316"/>
    <line x1="78" y1="243" x2="690" y2="243"/>
    <line x1="78" y1="169" x2="690" y2="169"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="320">10만</text>
    <text x="68" y="247">20만</text>
    <text x="68" y="173">30만</text>
    <text x="68" y="99">40만</text>
  </g>

  <g fill="#2fbf9b">
    <rect x="119" y="242" width="72" height="148" rx="4"/>
    <rect x="272" y="287" width="72" height="103" rx="4"/>
    <rect x="425" y="183" width="72" height="207" rx="4"/>
    <rect x="578" y="316" width="72" height="74" rx="4"/>
  </g>

  <g font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="155" y="234">20만</text>
    <text x="308" y="279">14만</text>
    <text x="461" y="175">28만~</text>
    <text x="614" y="308">10만</text>
  </g>

  <g text-anchor="middle">
    <text x="155" y="411" font-size="13" fill="#1f2d3d">카세트</text>
    <text x="308" y="411" font-size="13" fill="#1f2d3d">카세트</text>
    <text x="461" y="411" font-size="13" fill="#1f2d3d">덕트형</text>
    <text x="614" y="411" font-size="13" fill="#1f2d3d">벽형</text>
    <text x="155" y="429" font-size="11" fill="#9a9488">4방향</text>
    <text x="308" y="429" font-size="11" fill="#9a9488">1·2방향</text>
  </g>

  <text x="40" y="452" font-size="11" fill="#9a9488">※ 유닛 수·오염도·접근 조건에 따라 크게 달라집니다.</text>
</svg>
