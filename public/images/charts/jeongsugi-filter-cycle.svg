<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>정수기 필터 종류별 교체 주기 그래프</title>
  <desc>정수기 필터별 교체 주기 중간값. 세디먼트 약 5개월, 프리카본 약 9개월, RO 멤브레인 약 18개월, 포스트카본 약 12개월, UF 중공사막 약 15개월.</desc>
  <rect x="0.5" y="0.5" width="719" height="449" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">정수기 필터 종류별 교체 주기</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">필터마다 교체 주기가 다릅니다 (단위: 개월)</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="316" x2="690" y2="316"/>
    <line x1="78" y1="243" x2="690" y2="243"/>
    <line x1="78" y1="169" x2="690" y2="169"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="320">6</text>
    <text x="68" y="247">12</text>
    <text x="68" y="173">18</text>
    <text x="68" y="99">24</text>
  </g>

  <g fill="#2fbf9b">
    <rect x="109" y="328" width="60" height="62" rx="4"/>
    <rect x="232" y="279" width="60" height="111" rx="4"/>
    <rect x="354" y="169" width="60" height="221" rx="4"/>
    <rect x="476" y="242" width="60" height="148" rx="4"/>
    <rect x="599" y="206" width="60" height="184" rx="4"/>
  </g>

  <g font-size="12" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="139" y="320">5개월</text>
    <text x="262" y="271">9개월</text>
    <text x="384" y="161">18개월</text>
    <text x="506" y="234">12개월</text>
    <text x="629" y="198">15개월</text>
  </g>

  <g font-size="11" fill="#1f2d3d" text-anchor="middle">
    <text x="139" y="411">세디먼트</text>
    <text x="262" y="411">프리카본</text>
    <text x="384" y="411">RO 멤브레인</text>
    <text x="506" y="411">포스트카본</text>
    <text x="629" y="411">UF 중공사막</text>
  </g>

  <text x="40" y="438" font-size="11" fill="#9a9488">※ 사용량·수질에 따라 실제 교체 주기는 달라집니다.</text>
</svg>
