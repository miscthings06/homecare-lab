<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>이사 생활서비스 신청 순서 가로 타임라인</title>
  <desc>이사 생활서비스 신청 순서. D-30 인터넷 신청, D-21 렌탈 이전, D-14 입주청소·폐가전 수거, D-7 하자 점검, 이사 당일 도시가스·관리실 신고, 이사 후 전입신고.</desc>
  <rect x="0.5" y="0.5" width="719" height="219" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2d3d">이사 생활서비스 신청 순서표</text>
  <text x="40" y="66" font-size="13" fill="#666f7a">D-30부터 이사 후까지 신청 순서</text>

  <line x1="90" y1="150" x2="666" y2="150" stroke="#9fe1cb" stroke-width="3"/>

  <g text-anchor="middle">
    <text x="90" y="126" font-size="11" fill="#4a5568">인터넷 신청</text>
    <circle cx="90" cy="150" r="6" fill="#2fbf9b"/>
    <text x="90" y="180" font-size="12" font-weight="700" fill="#1f2d3d">D-30</text>

    <text x="205" y="126" font-size="11" fill="#4a5568">렌탈 이전</text>
    <circle cx="205" cy="150" r="6" fill="#2fbf9b"/>
    <text x="205" y="180" font-size="12" font-weight="700" fill="#1f2d3d">D-21</text>

    <text x="320" y="126" font-size="11" fill="#4a5568">청소·폐가전</text>
    <circle cx="320" cy="150" r="6" fill="#2fbf9b"/>
    <text x="320" y="180" font-size="12" font-weight="700" fill="#1f2d3d">D-14</text>

    <text x="436" y="126" font-size="11" fill="#4a5568">하자 점검</text>
    <circle cx="436" cy="150" r="6" fill="#2fbf9b"/>
    <text x="436" y="180" font-size="12" font-weight="700" fill="#1f2d3d">D-7</text>

    <text x="551" y="126" font-size="11" fill="#4a5568">가스·관리실</text>
    <circle cx="551" cy="150" r="6" fill="#189a7b"/>
    <text x="551" y="180" font-size="12" font-weight="700" fill="#1f2d3d">이사 당일</text>

    <text x="666" y="126" font-size="11" fill="#4a5568">전입신고</text>
    <circle cx="666" cy="150" r="6" fill="#2fbf9b"/>
    <text x="666" y="180" font-size="12" font-weight="700" fill="#1f2d3d">이사 후</text>
  </g>
</svg>
