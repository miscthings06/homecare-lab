<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>매트리스 크기별 전문 청소 비용 그래프</title>
  <desc>스팀·진드기 살균 기준 매트리스 크기별 전문 청소 비용 중간값. 싱글 약 8만원, 더블·퀸 약 12만원, 킹 약 16만원.</desc>
  <rect x="0.5" y="0.5" width="719" height="449" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">매트리스 크기별 전문 청소 비용</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">고온 스팀·진드기 살균 기준</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="316" x2="690" y2="316"/>
    <line x1="78" y1="243" x2="690" y2="243"/>
    <line x1="78" y1="169" x2="690" y2="169"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="320">5만</text>
    <text x="68" y="247">10만</text>
    <text x="68" y="173">15만</text>
    <text x="68" y="99">20만</text>
  </g>

  <g fill="#2fbf9b">
    <rect x="140" y="272" width="80" height="118" rx="4"/>
    <rect x="344" y="213" width="80" height="177" rx="4"/>
    <rect x="548" y="154" width="80" height="236" rx="4"/>
  </g>

  <g font-size="14" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="180" y="264">8만</text>
    <text x="384" y="205">12만</text>
    <text x="588" y="146">16만</text>
  </g>

  <g font-size="13" fill="#1f2d3d" text-anchor="middle">
    <text x="180" y="411">싱글</text>
    <text x="384" y="411">더블·퀸</text>
    <text x="588" y="411">킹</text>
  </g>

  <text x="40" y="438" font-size="11" fill="#9a9488">※ 얼룩 제거 시 1~3만원 추가. 오염도·지역에 따라 달라집니다.</text>
</svg>
