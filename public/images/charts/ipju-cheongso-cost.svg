<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>입주청소 평수별 기본 비용 그래프</title>
  <desc>수도권 일반 오염도 기준 평수별 입주청소 비용 중간값. 10평 이하 약 14만원, 20평 약 23만원, 30평 약 34만원, 40평 약 50만원, 50평 이상 60만원 이상.</desc>
  <rect x="0.5" y="0.5" width="719" height="449" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">입주청소 평수별 기본 비용</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">수도권 일반 오염도 기준 (2026년)</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="316" x2="690" y2="316"/>
    <line x1="78" y1="243" x2="690" y2="243"/>
    <line x1="78" y1="169" x2="690" y2="169"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="320">20만</text>
    <text x="68" y="247">40만</text>
    <text x="68" y="173">60만</text>
    <text x="68" y="99">80만</text>
  </g>

  <g fill="#2fbf9b">
    <rect x="109" y="338" width="60" height="52" rx="4"/>
    <rect x="232" y="305" width="60" height="85" rx="4"/>
    <rect x="354" y="265" width="60" height="125" rx="4"/>
    <rect x="476" y="206" width="60" height="184" rx="4"/>
    <rect x="599" y="132" width="60" height="258" rx="4"/>
  </g>

  <g font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="139" y="330">14만</text>
    <text x="262" y="297">23만</text>
    <text x="384" y="257">34만</text>
    <text x="506" y="198">50만</text>
    <text x="629" y="124">60만~</text>
  </g>

  <g font-size="13" fill="#1f2d3d" text-anchor="middle">
    <text x="139" y="411">~10평</text>
    <text x="262" y="411">20평</text>
    <text x="384" y="411">30평</text>
    <text x="506" y="411">40평</text>
    <text x="629" y="411">50평~</text>
  </g>

  <text x="40" y="438" font-size="11" fill="#9a9488">※ 고오염·특수 항목 시 30~50% 상향. 반드시 현장 견적 확인.</text>
</svg>
