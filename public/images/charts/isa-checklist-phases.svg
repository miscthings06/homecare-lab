    <text x="356" y="122" font-size="13" font-weight="700" fill="#0f6e56" text-anchor="middle">1주 전</text>
    <text x="356" y="148" font-size="10.5" fill="#4a5568" text-anchor="middle">짐 포장</text>
    <text x="356" y="167" font-size="10.5" fill="#4a5568" text-anchor="middle">주소 변경 신청</text>
  </g>
  <path d="M417 145 L429 145 M423 139 L429 145 L423 151" stroke="#2fbf9b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="427" y="92" width="116" height="106" rx="10" fill="#eef6f3"/>
    <text x="485" y="122" font-size="13" font-weight="700" fill="#0f6e56" text-anchor="middle">이사 당일</text>
    <text x="485" y="148" font-size="10.5" fill="#4a5568" text-anchor="middle">검침 사진 촬영</text>
