<svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>이사 준비 단계별 체크리스트 인포그래픽</title>
  <desc>이사 준비 단계. 1개월 전 업체 견적·인터넷 신청, 2주 전 폐가전 수거·짐 정리, 1주 전 짐 포장·주소 변경, 이사 당일 검침 사진·하자 점검, 이사 후 14일 내 전입신고.</desc>
  <rect x="0.5" y="0.5" width="719" height="229" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2d3d">이사 준비 단계별 체크리스트</text>
  <text x="40" y="66" font-size="13" fill="#666f7a">1개월 전부터 이사 후까지 핵심 일정</text>

  <g>
    <rect x="40" y="92" width="116" height="106" rx="10" fill="#eef6f3"/>
    <text x="98" y="122" font-size="13" font-weight="700" fill="#0f6e56" text-anchor="middle">1개월 전</text>
    <text x="98" y="148" font-size="10.5" fill="#4a5568" text-anchor="middle">업체 견적·예약</text>
    <text x="98" y="167" font-size="10.5" fill="#4a5568" text-anchor="middle">인터넷 이전 신청</text>
  </g>
  <path d="M159 145 L171 145 M165 139 L171 145 L165 151" stroke="#2fbf9b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

