    <text x="227" y="122" font-size="13" font-weight="700" fill="#0f6e56" text-anchor="middle">2주 전</text>
    <text x="227" y="148" font-size="10.5" fill="#4a5568" text-anchor="middle">폐가전 수거 신청</text>
    <text x="227" y="167" font-size="10.5" fill="#4a5568" text-anchor="middle">짐 정리 시작</text>
  </g>
  <path d="M288 145 L300 145 M294 139 L300 145 L294 151" stroke="#2fbf9b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
