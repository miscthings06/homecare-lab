<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>공기청정기 용량별 월 전기요금 그래프</title>
  <desc>24시간 자동 운전, kWh당 165원 기준 월 전기요금 중간값. 20평 이하 약 3,750원, 30~40평 약 6,500원, 50평 이상 약 9,500원.</desc>
  <rect x="0.5" y="0.5" width="719" height="449" rx="14" fill="#ffffff" stroke="#ece7dc"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2d3d">공기청정기 용량별 월 전기요금</text>
  <text x="40" y="70" font-size="13" fill="#666f7a">24시간 자동 운전 · kWh당 165원 기준 추정</text>

  <g stroke="#eee8db" stroke-width="1">
    <line x1="78" y1="390" x2="690" y2="390"/>
    <line x1="78" y1="316" x2="690" y2="316"/>
    <line x1="78" y1="243" x2="690" y2="243"/>
    <line x1="78" y1="169" x2="690" y2="169"/>
    <line x1="78" y1="95" x2="690" y2="95"/>
  </g>
  <g font-size="12" fill="#9a9488" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="320">3천</text>
    <text x="68" y="247">6천</text>
    <text x="68" y="173">9천</text>
    <text x="68" y="99">1.2만</text>
  </g>

  <g fill="#2fbf9b">
    <rect x="140" y="298" width="80" height="92" rx="4"/>
    <rect x="344" y="230" width="80" height="160" rx="4"/>
    <rect x="548" y="156" width="80" height="234" rx="4"/>
  </g>

  <g font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="180" y="290">3,750원</text>
    <text x="384" y="222">6,500원</text>
    <text x="588" y="148">9,500원</text>
  </g>

  <g font-size="13" fill="#1f2d3d" text-anchor="middle">
    <text x="180" y="411">20평 이하</text>
    <text x="384" y="411">30~40평</text>
    <text x="588" y="411">50평 이상</text>
  </g>

  <text x="40" y="438" font-size="11" fill="#9a9488">※ 풍량·운전 모드에 따라 실제 요금은 달라집니다.</text>
</svg>
